<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SITTA Universitas Terbuka</title>
    <!-- Hubungkan CSS eksternal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="login-box">
        <img class="login-logo" src="assets/logo-ut.png" alt="Logo Universitas Terbuka">
        
        <h1>Selamat Datang</h1>
        <p class="subtitle">Sistem informasi Tiras dan Transaksi Bahan Ajar</p>

        <!-- Area Tampilan Notifikasi / Error -->
        <div id="login-notification" style="display: none; font-size: 0.9rem; font-weight: 600; text-align: center; margin-bottom: 15px; padding: 10px; border-radius: 6px; background-color: #f8d7da; color: #721c24;"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="contoh: admin@ut.ac.id">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn-login">Login</button>

            <div class="auth-links">
                <a href="#" onclick="openModal('modalLupaPassword')">Lupa Password?</a>
                <a href="#" onclick="openModal('modalDaftar')">Daftar</a>
            </div>
        </form>

        <!-- Kotak Informasi Akun Demo -->
        <div class="demo-box" style="margin-top: 20px; font-size: 0.85rem; color: #666; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #dee2e6;">
            <strong>Akun demo:</strong><br>
            admin@ut.ac.id / admin123<br>
            mutiara@ut.ac.id / mutiara123
        </div>
    </main>

    <!-- Modal Lupa Password -->
    <div id="modalLupaPassword" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modalLupaPassword')">&times;</span>
            <h3 style="margin-bottom: 10px;">Lupa Password</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Masukkan email terdaftar untuk instruksi pemulihan.</p>
            <div class="form-group">
                <input type="email" placeholder="Email terdaftar...">
            </div>
            <button type="button" class="btn-login" onclick="alert('Instruksi reset password telah dikirim.'); closeModal('modalLupaPassword');">Kirim</button>
        </div>
    </div>

    <!-- Modal Daftar (Dilengkapi Input Password & Konfirmasi Password) -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modalDaftar')">&times;</span>
            <h3 style="margin-bottom: 10px;">Pendaftaran Akun</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Silakan isi data untuk pendaftaran akun baru.</p>
            
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="reg-nama" placeholder="Nama lengkap..." required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="Email..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Buat password..." required>
            </div>
            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="reg-confirm-password" placeholder="Ulangi password..." required>
            </div>

            <button type="button" class="btn-login" onclick="prosesDaftar()">Daftar</button>
        </div>
    </div>

    <!-- Script Pengaturan Modal, Validasi, & Proses Login -->
    <script>
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = "flex";
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = "none";
            }
        }

        // Fungsi Login Utama yang Menyimpan Nama ke localStorage Berdasarkan Email
        function handleLogin(event) {
            event.preventDefault(); // Mencegah reload halaman secara default

            const emailInput = document.getElementById("email").value.trim().toLowerCase();
            const passwordInput = document.getElementById("password").value.trim();
            const notification = document.getElementById("login-notification");

            // Validasi Sederhana Akun Demo
            if (emailInput === "admin@ut.ac.id" && passwordInput === "admin123") {
                localStorage.setItem("sitta_nama", "Admin");
                window.location.href = "dashboard.html";
            } else if (emailInput === "mutiara@ut.ac.id" && passwordInput === "mutiara123") {
                localStorage.setItem("sitta_nama", "Mutiara");
                window.location.href = "dashboard.html";
            } else {
                // Jika email lain atau daftar mandiri, ambil nama depan dari email sebagai nama user
                let extractedName = emailInput.split("@")[0];
                let formattedName = extractedName.charAt(0).toUpperCase() + extractedName.slice(1);
                
                // Simpan ke localStorage
                localStorage.setItem("sitta_nama", formattedName);
                window.location.href = "dashboard.html";
            }
        }

        function prosesDaftar() {
            const nama = document.getElementById('reg-nama').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            const confirmPass = document.getElementById('reg-confirm-password').value;

            if (!nama || !email || !pass || !confirmPass) {
                alert('Semua kolom wajib diisi!');
                return;
            }

            if (pass !== confirmPass) {
                alert('Password dan Konfirmasi Password tidak cocok!');
                return;
            }

            alert('Pendaftaran akun untuk ' + nama + ' berhasil diajukan!');
            closeModal('modalDaftar');
        }
    </script>

    <!-- Panggil file data.js terlebih dahulu sebelum script.js -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
